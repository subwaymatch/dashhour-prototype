# Comments the Cloudflare Worker Preview URL on pull requests.
#
# Workers Builds deploys a Preview for every branch, but only puts its URL in the pull request
# comment for builds that run `wrangler preview`. This project deploys with vinext and the `cf` CLI,
# so this job waits for the "Workers Builds" check on the pushed commit, reads the Preview's name
# from the check's dashboard link, and keeps one comment on the pull request up to date.
name: Preview URL

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  checks: read
  pull-requests: write

concurrency:
  group: preview-url-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    # Workers Builds only builds branches of this repository, not forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      # The account's workers.dev subdomain: https://<preview>-<worker>.<subdomain>.workers.dev
      WORKERS_SUBDOMAIN: subwaymatch
    steps:
      - name: Wait for the Workers Builds check
        id: check
        run: |
          for _ in $(seq 1 80); do
            run=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages" and (.name | startswith("Workers Builds")))][0] // empty')
            if [ -n "$run" ] && [ "$(jq -r .status <<<"$run")" = completed ]; then
              details=$(jq -r '.details_url // ""' <<<"$run")
              case "$details" in https://dash.cloudflare.com/*) ;; *) details="" ;; esac
              {
                echo "conclusion=$(jq -r .conclusion <<<"$run")"
                echo "details=$details"
                echo "preview=$(sed -nE 's#.*/previews/([a-z0-9-]+)/builds/.*#\1#p' <<<"$details")"
                echo "worker=$(sed -nE 's#.*/services/view/([a-z0-9-]+)/.*#\1#p' <<<"$details")"
              } >>"$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "No finished Workers Builds check for $SHA after 20 minutes; leaving the comment as it is."

      - name: Update the pull request comment
        if: steps.check.outputs.conclusion != ''
        env:
          CONCLUSION: ${{ steps.check.outputs.conclusion }}
          DETAILS: ${{ steps.check.outputs.details }}
          PREVIEW: ${{ steps.check.outputs.preview }}
          WORKER: ${{ steps.check.outputs.worker }}
        run: |
          marker='<!-- preview-url -->'
          log=""
          [ -n "$DETAILS" ] && log=" · [Build log]($DETAILS)"
          if [ "$CONCLUSION" = success ] && [ -n "$PREVIEW" ] && [ -n "$WORKER" ]; then
            url="https://$PREVIEW-$WORKER.$WORKERS_SUBDOMAIN.workers.dev"
            body=$(printf '%s\n**Preview:** %s\n\nDeployed from %s%s\n' "$marker" "$url" "${SHA:0:7}" "$log")
          else
            body=$(printf '%s\n**Preview build %s** for %s%s\n' "$marker" "$CONCLUSION" "${SHA:0:7}" "$log")
          fi
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
          fi
          echo "$body"
